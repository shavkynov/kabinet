name: Finish export integration with numbering regression tests
on:
  push:
    branches: [claude/bugreport-fixes]
    paths: ['.github/workflows/finish-export-integration.yml']
permissions:
  contents: write
concurrency:
  group: apply-export-target-once
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/bugreport-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update exact stale expectations
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          expected = {'test/mode.test.js': '0dcc4b9f2515d7ec0fe728be635df8b77c792b4c', 'test/project.test.js': '79ad4826630247d835613478ade5444548205204'}
          texts = {}
          for name, sha in expected.items():
              raw = Path(name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if actual != sha:
                  raise RuntimeError('Source changed; refusing to overwrite: ' + name)
              texts[name] = raw.decode('utf-8')
          def once(text, old, new):
              if text.count(old) != 1:
                  raise RuntimeError('Patch anchor not unique: ' + repr(old))
              return text.replace(old, new, 1)
          name = 'test/mode.test.js'
          text = once(texts[name], 'экспорт рассказов: названия без номеров и содержание; роман: нумерация как раньше', 'экспорт: рассказы без номеров; роман без номеров по умолчанию, с номерами по явному выбору')
          text = once(text, "  assert.match(novel, /## 2\\. Лисья нора/);", """  assert.match(novel, /^## Лисья нора$/m);
            assert.doesNotMatch(novel, /^## 2\\. Лисья нора$/m);
            const numbered = buildExport(dir, 'md', 'ru', { chapterNumbers: true });
            assert.match(numbered, /^## 2\\. Лисья нора$/m);""")
          text = once(text, "  assert.doesNotMatch(md, /## 2\\./);", """  assert.doesNotMatch(md, /## 2\\./);
            const numberedStories = buildExport(dir, 'md', 'ru', { chapterNumbers: true });
            assert.match(numberedStories, /^## Лисья нора$/m);
            assert.doesNotMatch(numberedStories, /^## 2\\. Лисья нора$/m);""")
          texts[name] = text
          name = 'test/project.test.js'
          texts[name] = once(texts[name], "  assert.match(md, /## 1\\. Начало/);", """  assert.match(md, /^## Начало$/m);
            assert.doesNotMatch(md, /^## 1\\. Начало$/m);
            assert.match(buildExport(dir, 'md', 'ru', { chapterNumbers: true }), /^## 1\\. Начало$/m);""")
          for name, text in texts.items():
              Path(name).write_text(text, encoding='utf-8')
      - run: node scripts/apply-export-target.cjs
      - run: npm ci
      - name: Targeted export checks
        run: |
          node --check main.js
          node --test test/mode.test.js test/project.test.js test/export-target.test.js test/export-blank-lines.test.js test/export-escapes.test.js test/i18n.test.js
      - run: npm test
      - run: npm run check
      - name: Commit only tested changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/mode.test.js test/project.test.js main.js package.json
          git commit -m 'fix: align numbering tests with opt-in export and remember export destination'
          git push origin HEAD:claude/bugreport-fixes
