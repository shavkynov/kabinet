name: Проверка ускорения горячих путей и защиты WebDAV
on:
  push:
    branches: [experiment/tauri-rust-finish]
    paths: ['.github/workflows/repair-hot-paths.yml']
permissions:
  contents: write
concurrency:
  group: repair-hot-paths-finish
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/experiment/tauri-rust-finish'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Пункт 2 - применить патч
        shell: python
        run: |
          import re
          from pathlib import Path

          def load(name):
              return Path(name).read_text(encoding='utf-8')

          def save(name, text):
              Path(name).write_text(text, encoding='utf-8', newline='\n')

          def once(text, old, label):
              if text.count(old) != 1:
                  raise RuntimeError(f'Ожидался ровно один фрагмент: {label}')

          def function_range(text, signature):
              once(text, signature, signature)
              start = text.index(signature)
              return start, text.index('\n}\n', start) + 3

          CALL = re.compile(r'Regex::new\((r"[^"]*")\)\.unwrap\(\)')

          def hoist(text, signature, expected):
              start, stop = function_range(text, signature)
              body = text[start:stop]
              if len(CALL.findall(body)) != expected or body.count('Regex::new(') != expected:
                  raise RuntimeError(f'Неожиданное число регулярных выражений: {signature}')
              body = CALL.sub(lambda m: '{ static C: std::sync::OnceLock<Regex> = std::sync::OnceLock::new(); C.get_or_init(|| Regex::new(' + m.group(1) + ').unwrap()) }', body)
              return text[:start] + body + text[stop:]

          def replace_function(text, signature, new_text):
              start, stop = function_range(text, signature)
              return text[:start] + new_text + text[stop:]

          webdav = 'experiments/tauri-app/core/src/webdav.rs'
          text = load(webdav)
          text = hoist(text, 'pub fn normalize_url(raw: &str) -> R<String> {', 1)
          text = hoist(text, 'fn unxml(s: &str) -> String {', 2)
          text = hoist(text, 'pub fn parse_multistatus(xml: &str) -> Vec<DavEntry> {', 6)
          text = replace_function(text, 'pub fn to_base64(data: &[u8]) -> String {', r'''pub fn to_base64(data: &[u8]) -> String {
              use ::base64::Engine as _;
              ::base64::engine::general_purpose::STANDARD.encode(data)
          }
          ''')
          save(webdav, text)

          fold = 'experiments/tauri-app/core/src/foldersync.rs'
          text = load(fold)
          old = r'''fn root_re() -> Regex { Regex::new(r"^project.*\.json$|^stats\.json$").unwrap() }'''
          once(text, old, 'root_re')
          new = r'''fn root_re() -> &'static Regex {
              static RE: std::sync::LazyLock<Regex> = std::sync::LazyLock::new(|| Regex::new(r"^project.*\.json$|^stats\.json$").unwrap());
              &RE
          }'''
          save(fold, text.replace(old, new, 1))

          store = 'experiments/tauri-app/core/src/store.rs'
          text = load(store)
          text = replace_function(text, 'fn base64(data: &[u8]) -> String {', r'''fn base64(data: &[u8]) -> String {
              use ::base64::Engine as _;
              ::base64::engine::general_purpose::STANDARD.encode(data)
          }
          ''')
          save(store, text)

          tests = r'''use kabinet_core::{store, webdav};
          use serde_json::json;
          use std::fs;

          #[test]
          fn to_base64_matches_standard_vectors() {
              assert_eq!(webdav::to_base64(b""), "");
              assert_eq!(webdav::to_base64(b"abc"), "YWJj");
              assert_eq!(webdav::to_base64(b"ab"), "YWI=");
              assert_eq!(webdav::to_base64(b"a"), "YQ==");
              assert_eq!(webdav::to_base64(&[0xfb, 0xff]), "+/8=");
          }

          #[test]
          fn read_image_encodes_with_standard_base64() {
              let dir = std::env::temp_dir().join(format!("kabinet-image-{}-{:016x}", std::process::id(), rand::random::<u64>()));
              store::create_project(&dir, "Картинки", None).unwrap();
              let folder = dir.join("Картинки");
              fs::create_dir_all(&folder).unwrap();
              fs::write(folder.join("abcdef.png"), [0x89, b'P', b'N', b'G', 0x0d, 0x0a, 0x1a, 0x0a]).unwrap();
              assert_eq!(store::read_image(&dir, "abcdef.png").unwrap(), json!("data:image/png;base64,iVBORw0KGgo="));
              let _ = fs::remove_dir_all(&dir);
          }

          #[test]
          fn project_file_names_are_still_recognised_as_syncable() {
              use kabinet_core::foldersync::is_syncable;
              assert!(is_syncable("project.json") && is_syncable("project-2.json") && is_syncable("stats.json"));
              assert!(!is_syncable("projectx.txt") && !is_syncable("kabinet.lock") && !is_syncable("notes.json"));
              for _ in 0..1000 {
                  assert!(is_syncable("Главы/abcdef.md"));
              }
          }
          '''
          with Path('experiments/tauri-app/core/tests/shared_helpers.rs').open('x', encoding='utf-8', newline='\n') as out:
              out.write(tests)
      - name: Пункт 2 - тесты ядра
        run: cargo test --manifest-path experiments/tauri-app/core/Cargo.toml
      - name: Пункт 2 - коммит
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- experiments/tauri-app/core/src/webdav.rs experiments/tauri-app/core/src/foldersync.rs experiments/tauri-app/core/src/store.rs experiments/tauri-app/core/tests/shared_helpers.rs
          git diff --cached --check
          git commit -m 'perf(core): compile hot-path regexes once and use the base64 crate'
      - name: Пункт 3 - применить патч
        shell: python
        run: |
          from pathlib import Path

          def load(name):
              return Path(name).read_text(encoding='utf-8')

          def save(name, text):
              Path(name).write_text(text, encoding='utf-8', newline='\n')

          def once(text, old, label):
              if text.count(old) != 1:
                  raise RuntimeError(f'Ожидался ровно один фрагмент: {label}')

          webdav = 'experiments/tauri-app/core/src/webdav.rs'
          text = load(webdav)
          anchor = 'impl Default for UreqHttp {'
          once(text, anchor, 'UreqHttp::default')
          helper = r'''const MAX_BODY: u64 = 256 * 1024 * 1024;

          /// Читает ответ целиком, но не обрезает молча: слишком большой ответ - это ошибка, а не «файл поменьше».
          pub fn read_capped(reader: impl std::io::Read, limit: u64) -> Result<Vec<u8>, String> {
              use std::io::Read;
              let mut body = Vec::new();
              reader.take(limit + 1).read_to_end(&mut body).map_err(|e| e.to_string())?;
              if body.len() as u64 > limit {
                  return Err(format!("ответ сервера больше {} МБ, файл не прочитан целиком", limit / (1024 * 1024)));
              }
              Ok(body)
          }

          '''
          text = text.replace(anchor, helper + anchor, 1)
          old_read = '        let mut body = Vec::new();\n        use std::io::Read;\n        resp.into_reader().take(256 * 1024 * 1024).read_to_end(&mut body).map_err(|e| e.to_string())?;\n'
          once(text, old_read, 'UreqHttp::request body')
          text = text.replace(old_read, '        let body = read_capped(resp.into_reader(), MAX_BODY)?;\n', 1)
          old_mkdir = 'self.mkdir_parts(&parent)?;'
          once(text, old_mkdir, 'WebDav::write mkdir')
          text = text.replace(old_mkdir, 'self.known.clear();\n            if !self.root_parts.is_empty() { self.mkdir_root()?; }\n            self.mkdir_parts(&parent)?;', 1)
          tests = r'''
          #[cfg(test)]
          mod folder_recovery_tests {
              use super::*;
              use crate::testutil::*;

              #[test]
              fn write_recovers_after_a_folder_was_deleted_on_the_server() {
                  let s = FakeServer::new();
                  let mut d = dav_on(&s, "/Кабинет/Роман");
                  d.write("Главы/a.md", "один".as_bytes()).unwrap();
                  {
                      let mut state = s.0.lock().unwrap();
                      state.dirs.remove("/Кабинет/Роман/Главы");
                      state.files.remove("/Кабинет/Роман/Главы/a.md");
                  }
                  d.write("Главы/b.md", "два".as_bytes()).unwrap();
                  assert_eq!(s.get("Кабинет/Роман/Главы/b.md").unwrap(), "два".as_bytes());
              }

              #[test]
              fn write_recovers_after_the_whole_root_was_deleted_on_the_server() {
                  let s = FakeServer::new();
                  let mut d = dav_on(&s, "/Кабинет/Роман");
                  d.write("Главы/a.md", "один".as_bytes()).unwrap();
                  {
                      let mut state = s.0.lock().unwrap();
                      state.dirs.clear();
                      state.files.clear();
                  }
                  d.write("Главы/b.md", "два".as_bytes()).unwrap();
                  assert_eq!(s.get("Кабинет/Роман/Главы/b.md").unwrap(), "два".as_bytes());
              }

              #[test]
              fn read_capped_reports_oversized_bodies_instead_of_truncating() {
                  assert_eq!(read_capped(&b"abcd"[..], 4).unwrap(), b"abcd".to_vec());
                  assert!(read_capped(&b"abcde"[..], 4).unwrap_err().contains("больше"));
                  assert!(read_capped(&b""[..], 4).unwrap().is_empty());
              }
          }
          '''
          save(webdav, text.rstrip('\n') + '\n' + tests)
      - name: Пункт 3 - тесты ядра
        run: cargo test --manifest-path experiments/tauri-app/core/Cargo.toml
      - name: Пункт 3 - коммит и запись в ветку
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- experiments/tauri-app/core/src/webdav.rs
          git diff --cached --check
          git commit -m 'fix(webdav): recreate folders deleted on the server and reject oversized responses'
          git push origin HEAD:refs/heads/experiment/tauri-rust-finish
