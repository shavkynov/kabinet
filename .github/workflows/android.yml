# Собирает APK для Android в облаке GitHub (на компьютере автора Android Studio не нужна).
# Запуск: вкладка Actions → «Android APK» → Run workflow. Готовый файл — внизу страницы запуска, раздел Artifacts.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Метка выпуска, к которому добавить APK (например, v0.34.0). Пусто: только собрать'
        required: false
  push:
    tags: ['android-*']

permissions:
  contents: write   # нужен, чтобы APK попал в выпуск (Release)

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Зависимости (Electron для Android не нужен, его не качаем)
        run: |
          npm install --ignore-scripts
          cd mobile && npm install

      - name: Тесты (прерывают сборку, если что-то сломано)
        run: |
          npm test
          node mobile/test/run-smoke.js

      - name: Сборка интерфейса для Android
        run: node mobile/build.js

      # Ключ подписи хранится в Secrets репозитория, а не в коде:
      #   KABINET_KEYSTORE_BASE64  файл ключа в base64 (base64 -w0 kabinet-release.keystore)
      #   KABINET_KEYSTORE_PASSWORD, KABINET_KEY_ALIAS (необязательно), KABINET_KEY_PASSWORD (необязательно)
      # Без них APK подпишется отладочным ключом и не встанет поверх уже установленной боевой версии.
      - name: Ключ подписи
        env:
          KS_B64: ${{ secrets.KABINET_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kabinet-release.keystore"
            echo "KABINET_KEYSTORE=$RUNNER_TEMP/kabinet-release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет KABINET_KEYSTORE_BASE64 не задан: APK будет подписан отладочным ключом."
          fi

      - name: Проект Android (значки, подпись, плагин клавиатуры)
        env:
          KABINET_KEYSTORE_PASSWORD: ${{ secrets.KABINET_KEYSTORE_PASSWORD }}
          KABINET_KEY_ALIAS: ${{ secrets.KABINET_KEY_ALIAS }}
          KABINET_KEY_PASSWORD: ${{ secrets.KABINET_KEY_PASSWORD }}
        run: node mobile/android-setup.js

      - name: APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Переименовать
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/*.apk "out/Kabinet-${VERSION}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Kabinet-android
          path: out/*.apk

      - name: Добавить APK в выпуск
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: out/*.apk
