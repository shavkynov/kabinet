name: Preserve local dictionary on first attachment
on:
  push:
    branches: [claude/bugreport-fixes]
    paths: ['.github/workflows/preserve-local-dictionary-once.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/bugreport-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify reproduction before patch
        shell: python
        run: |
          import subprocess, xml.etree.ElementTree as ET
          result = subprocess.run(['node', '--test', '--test-reporter=junit', '--test-reporter-destination=/tmp/dict-baseline.xml', 'test/dict-folder.test.js'], capture_output=True, text=True)
          cases = list(ET.parse('/tmp/dict-baseline.xml').getroot().iter('testcase'))
          failed = [c for c in cases if c.find('failure') is not None or c.find('error') is not None]
          if result.returncode == 0 or len(cases) != 4 or len(failed) != 4:
              raise RuntimeError('Expected four reproducing failures; refusing unverified patch')
      - name: Apply minimal guarded fix and register tests
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          p = Path('src/folder.js')
          raw = p.read_bytes()
          sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if sha != '734980acf4474c55feddf2a91f5b64cdbf21d0ab':
              raise RuntimeError('folder.js changed; refusing overwrite')
          text = raw.decode('utf-8')
          old = 'const hasLocalContent = added.length > 0 || trashExtra.length > 0'
          if text.count(old) != 1:
              raise RuntimeError('Patch anchor not unique')
          new = old + "\n      || Object.hasOwn(localMeta, 'words')"
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          pkg = Path('package.json')
          text = pkg.read_text(encoding='utf-8')
          command = json.loads(text)['scripts']['test']
          if 'test/dict-folder.test.js' in command:
              raise RuntimeError('Test already registered')
          old = json.dumps(command, ensure_ascii=False)
          new = json.dumps(command + ' test/dict-folder.test.js', ensure_ascii=False)
          if text.count(old) != 1:
              raise RuntimeError('Test command anchor not unique')
          pkg.write_text(text.replace(old, new, 1), encoding='utf-8')
      - run: node --check src/folder.js
      - run: node --test test/dict-folder.test.js test/dict.test.js test/folder.test.js
      - run: npm test
      - run: npm run check
      - name: Commit only tested fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/folder.js package.json
          git commit -m 'fix: preserve dictionary-only metadata before first folder adoption'
          git push origin HEAD:claude/bugreport-fixes
