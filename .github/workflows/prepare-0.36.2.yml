name: Prepare 0.36.2 metadata

'on':
  push:
    branches: [diag/sync-metrics]
    paths:
      - '.github/workflows/prepare-0.36.2.yml'
      - 'scripts/prepare-0.36.2.js'
      - 'docs/releases/0.36.2.txt'

permissions:
  contents: write

concurrency:
  group: prepare-0.36.2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update application version and append changelog without resolving dependencies
        run: node scripts/prepare-0.36.2.js
      - name: Commit only release metadata to the approved working branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/diag/sync-metrics"
          REMOTE=$(git ls-remote origin refs/heads/diag/sync-metrics | cut -f1)
          if [ "$REMOTE" != "$EXPECTED_SHA" ]; then
            echo "::error::Branch changed after checkout; refusing to push stale metadata."
            exit 1
          fi
          git add -- package.json package-lock.json CHANGELOG.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: bump application to 0.36.2 and update changelog'
          git push origin HEAD:refs/heads/diag/sync-metrics
