name: Desktop OAuth verification

'on':
  push:
    branches: [ui/yandex-only-sync]
    paths:
      - '.github/workflows/desktop-oauth-check.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'main.js'
      - 'preload.js'
      - 'src/**'
      - 'renderer/**'
      - 'scripts/**'
      - 'test/**'
      - 'build/**'
      - 'sounds/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-oauth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Verify and package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            command: npx electron-builder --win nsis --x64 --publish never -c.win.signAndEditExecutable=false
          - os: ubuntu-latest
            name: linux-x64
            command: npx electron-builder --linux AppImage --x64 --publish never
          - os: macos-latest
            name: mac-arm64-and-intel
            command: |
              npx electron-builder --mac dmg --arm64 --publish never -c.artifactName='Kabinet-${version}-mac-arm64.${ext}'
              npx electron-builder --mac dmg --x64 --publish never -c.artifactName='Kabinet-${version}-mac-intel.${ext}'
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          npm ci 2>&1 | tee ci-logs/install.log
      - name: Full project checks and all tests
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee ci-logs/check.log
      - name: Build renderer
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee ci-logs/renderer.log
      - name: Package test installers
        run: |
          set -euo pipefail
          {
            ${{ matrix.command }}
          } 2>&1 | tee ci-logs/package.log
      - name: Upload test installers
        uses: actions/upload-artifact@v4
        with:
          name: kabinet-oauth-${{ matrix.name }}-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kabinet-oauth-logs-${{ matrix.name }}-${{ github.sha }}
          path: ci-logs/*.log
          if-no-files-found: warn
          retention-days: 7
