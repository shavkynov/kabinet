name: F5 sync regression tests
on:
  push:
    branches: [claude/bugreport-fixes]
    paths:
      - 'renderer/app/36-dav.js'
      - 'test/dav-quick-sync.test.js'
      - '.github/workflows/dav-quick-sync.yml'
  pull_request:
    paths:
      - 'renderer/app/36-dav.js'
      - 'test/dav-quick-sync.test.js'
      - '.github/workflows/dav-quick-sync.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test test/dav-quick-sync.test.js
