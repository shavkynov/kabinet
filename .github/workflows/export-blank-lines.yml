name: Export blank line regression tests
on:
  push:
    branches: [claude/bugreport-fixes]
    paths:
      - 'src/**'
      - 'test/export-blank-lines.test.js'
      - '.github/workflows/export-blank-lines.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/export-blank-lines.test.js'
      - '.github/workflows/export-blank-lines.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test test/export-blank-lines.test.js test/export-escapes.test.js
