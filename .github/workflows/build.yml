name: Проверка и сборка

on:
  push:
    branches: [main, master]
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Метка выпуска, к которому добавить установщики (например, v0.31.2). Пусто: только собрать'
        required: false

permissions:
  contents: write   # нужен, чтобы выпуск (Release) получил файлы

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Зависимости
        id: dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$RUNNER_TEMP/kabinet-dependencies.log"
      - name: Общая проверка
        id: validation
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/kabinet-validation.log"
      - name: Краткая причина ошибки для аудита
        if: ${{ failure() && (steps.dependencies.outcome == 'failure' || steps.validation.outcome == 'failure') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FAILED_STEP: ${{ steps.dependencies.outcome == 'failure' && 'dependencies' || 'validation' }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          (async () => {
            const env = process.env;
            const repo = env.GITHUB_REPOSITORY;
            const sha = env.DIAGNOSTIC_SHA;
            if (!/^[\w.-]+\/[\w.-]+$/.test(repo || '') || !/^[a-f0-9]{40}$/.test(sha || '')) throw new Error('Недопустимая цель диагностики.');
            const step = env.FAILED_STEP === 'dependencies' ? 'dependencies' : 'validation';
            const task = step === 'dependencies' ? 'npm ci' : 'npm run check';
            let log = '';
            try { log = fs.readFileSync(path.join(env.RUNNER_TEMP, `kabinet-${step}.log`), 'utf8'); } catch {}
            const lines = log.replace(/\x1b\[[0-9;]*m/g, '').split(/\r?\n/).map((s) => s.trim());
            const reason = lines.find((s) => /^not ok\b/.test(s))
              || lines.find((s) => /^npm (?:ERR!|error) code [A-Z0-9_]+$/.test(s))
              || lines.find((s) => /^✗ /.test(s))
              || 'Ошибка; подробности в журнале job';
            const description = Array.from(`${task}: ${reason}`.replace(/[\x00-\x1f\x7f]/g, ' ')).slice(0, 140).join('');
            const response = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
              method: 'POST', redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ state: 'failure', context: 'audit/check-failure', description,
                target_url: `https://github.com/${repo}/actions/runs/${env.GITHUB_RUN_ID}` }),
            });
            if (!response.ok) throw new Error(`Не удалось записать диагностический статус: HTTP ${response.status}`);
            console.log(description);
          })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE

  # Основная версия — Кабинет на Tauri (Rust). Установщики собираются при выпуске версии (метка v0.0.0) или вручную.
  # Окно в настоящем Chromium с подставным мостом: запуск без исключений, меню правой кнопки, переименование проекта.
  ui-smoke:
    if: github.ref_type != 'tag'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node experiments/tauri-app/build.cjs
      - run: npm i --no-save playwright@1.49.1
      - name: Chromium для UI-smoke (повтор при сбое зеркал apt)
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "Попытка $attempt не удалась, повтор через 20 секунд." >&2
            sleep 20
          done
          exit 1
      - run: node test-ui/ui-smoke.js

  # Тесты Rust и компиляция оболочки на всех системах при каждом push и запросе слияния,
  # чтобы поломку под Windows или macOS увидеть сразу, а не при выпуске по метке.
  rust-check:
    if: github.ref_type != 'tag'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Библиотеки Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xdg-utils
      - name: Тесты Rust (ядро)
        run: cargo test --locked --manifest-path experiments/tauri-app/core/Cargo.toml
      - name: Окно для оболочки
        run: |
          npm run build
          node experiments/tauri-app/build.cjs
      - name: Оболочка компилируется
        run: cargo check --locked --manifest-path experiments/tauri-app/src-tauri/Cargo.toml

  tauri-test:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Метка совпадает с версией
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          V=$(node -p "require('./package.json').version")
          T=$(node -p "require('./experiments/tauri-app/src-tauri/tauri.conf.json').version")
          C=$(grep -m1 '^version' experiments/tauri-app/src-tauri/Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "метка=$TAG package=$V tauri=$T cargo=$C"
          # при пробном запуске без метки (ветка main) метку не сверяем
          case "$TAG" in v[0-9]*|[0-9]*) [ "${TAG#v}" = "$V" ] || BAD=1 ;; esac
          if [ -n "$BAD" ] || [ "$V" != "$T" ] || [ "$V" != "$C" ]; then
            echo "::error::Метка и версии в package.json, tauri.conf.json и Cargo.toml не совпадают."
            exit 1
          fi
      - name: Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Тесты Rust (ядро — проекты, Яндекс Диск, синхронизация)
        run: cargo test --locked --manifest-path experiments/tauri-app/core/Cargo.toml

  build:
    needs: tauri-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            name: mac-arm64
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            name: mac-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            name: linux
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rust stable
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Библиотеки Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xdg-utils
      - name: Установщик (${{ matrix.name }})
        shell: bash
        working-directory: experiments/tauri-app
        run: npx --yes @tauri-apps/cli@2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Проверка ad-hoc подписи macOS (для работы kabinet://)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          DMG=$(ls experiments/tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -n1)
          MNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -quiet
          APP=$(ls -d "$MNT"/*.app | head -n1)
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/"* || true
          hdiutil detach "$MNT" -quiet
      - name: Имена файлов
        shell: bash
        run: |
          set -e
          V=$(node -p "require('./package.json').version")
          B="experiments/tauri-app/src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          case "${{ matrix.name }}" in
            windows)   cp "$B"/nsis/*.exe "out/Kabinet-$V-windows-x64.exe" ;;
            mac-arm64) cp "$B"/dmg/*.dmg "out/Kabinet-$V-mac-arm64.dmg" ;;
            mac-intel) cp "$B"/dmg/*.dmg "out/Kabinet-$V-mac-intel.dmg" ;;
            linux)     cp "$B"/appimage/*.AppImage "out/Kabinet-$V-linux-x64.AppImage"
                       cp "$B"/deb/*.deb "out/Kabinet-$V-linux-x64.deb" ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: kabinet-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  android:
    # APK собирается вместе с установщиками: при выпуске версии или вручную
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # выпуск = метка версии или ручной запуск с указанной меткой
      PUBLISH: ${{ (github.ref_type == 'tag' || inputs.tag != '') && 'true' || 'false' }}
      # отпечаток SHA-256 рабочего ключа подписи (не секрет); при смене ключа обновите
      EXPECTED_CERT_SHA256: 8703ed4e9f4cd67775750fa7ef56efee515b441aa279ce478d0ca73dd851bf96
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Зависимости
        run: |
          npm ci --ignore-scripts
          cd mobile && npm install

      - name: Проверка мобильной части
        run: node mobile/test/run-smoke.js

      - name: Сборка интерфейса для Android
        run: node mobile/build.js

      # Ключ хранится в Secrets репозитория: KABINET_KEYSTORE_BASE64, KABINET_KEYSTORE_PASSWORD,
      # KABINET_KEY_ALIAS (по умолчанию kabinet), KABINET_KEY_PASSWORD (по умолчанию как пароль хранилища).
      - name: Ключ подписи
        env:
          KS_B64: ${{ secrets.KABINET_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kabinet-release.keystore"
            echo "KABINET_KEYSTORE=$RUNNER_TEMP/kabinet-release.keystore" >> "$GITHUB_ENV"
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::Секрет KABINET_KEYSTORE_BASE64 не задан: выпуск с отладочной подписью запрещён."
            exit 1
          else
            echo "::warning::Секрет KABINET_KEYSTORE_BASE64 не задан: APK будет подписан отладочным ключом."
          fi

      - name: Проект Android (значки, подпись, плагины)
        env:
          KABINET_KEYSTORE_PASSWORD: ${{ secrets.KABINET_KEYSTORE_PASSWORD }}
          KABINET_KEY_ALIAS: ${{ secrets.KABINET_KEY_ALIAS }}
          KABINET_KEY_PASSWORD: ${{ secrets.KABINET_KEY_PASSWORD }}
        run: node mobile/android-setup.js

      - name: APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Проверить подпись
        run: |
          set -euo pipefail
          APK=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -n1)
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SIGNER=$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -n1)
          "$SIGNER" verify --print-certs "$APK" > signer.txt
          grep -v '^WARNING: META-INF' signer.txt || true
          ACTUAL=$(grep -m1 'certificate SHA-256 digest:' signer.txt | sed 's/.*digest: *//' | tr -d '[:space:]' | tr 'A-F' 'a-f' || true)
          if [ -z "$ACTUAL" ]; then
            echo "::error::Не удалось прочитать отпечаток подписи APK."
            exit 1
          fi
          echo "Отпечаток подписи APK: $ACTUAL"
          if [ "$PUBLISH" = "true" ] && [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK подписан не рабочим ключом (ожидался $EXPECTED_CERT_SHA256). В выпуск он не попадёт."
            exit 1
          fi

      - name: Переименовать
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/*.apk "out/Kabinet-${VERSION}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kabinet-android
          path: out/*.apk
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || inputs.tag != ''
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: src
      - name: Патчноут из CHANGELOG.txt
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          V="${TAG#v}"
          awk -v v="$V" '$0==v{on=1;next} on&&/^[0-9]+\.[0-9]+\.[0-9]+$/{exit} on{print}' src/CHANGELOG.txt > notes.md
          if [ ! -s notes.md ]; then echo "::error::В CHANGELOG.txt нет раздела $V."; exit 1; fi
          cat >> notes.md <<'FOOTER'

          Первый запуск. Кабинет распространяется свободно и без платной подписи, поэтому система может предупредить:
          Windows: в окне SmartScreen нажмите «Подробнее», затем «Выполнить в любом случае».
          macOS: перетащите «Кабинет» в «Программы» (не запускайте из окна dmg) и откройте. Если система пишет «файл повреждён» — это карантин, а не повреждение; выполните в Терминале:
            xattr -dr com.apple.quarantine "/Applications/Кабинет.app"
          либо откройте «Системные настройки → Конфиденциальность и безопасность → Всё равно открыть».
          Контрольная сумма SHA256 каждого файла указана на этой странице рядом с файлом.
          FOOTER
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: notes.md
          files: files/*
