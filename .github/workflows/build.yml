name: Проверка и сборка

on:
  push:
    branches: [main, master]
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Метка выпуска, к которому добавить установщики (например, v0.31.2). Пусто: только собрать'
        required: false

permissions:
  contents: write   # нужен, чтобы выпуск (Release) получил файлы

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Зависимости
        id: dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$RUNNER_TEMP/kabinet-dependencies.log"
      - name: Общая проверка
        id: validation
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/kabinet-validation.log"
      - name: Краткая причина ошибки для аудита
        if: ${{ failure() && (steps.dependencies.outcome == 'failure' || steps.validation.outcome == 'failure') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FAILED_STEP: ${{ steps.dependencies.outcome == 'failure' && 'dependencies' || 'validation' }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          (async () => {
            const env = process.env;
            const repo = env.GITHUB_REPOSITORY;
            const sha = env.DIAGNOSTIC_SHA;
            if (!/^[\w.-]+\/[\w.-]+$/.test(repo || '') || !/^[a-f0-9]{40}$/.test(sha || '')) throw new Error('Недопустимая цель диагностики.');
            const step = env.FAILED_STEP === 'dependencies' ? 'dependencies' : 'validation';
            const task = step === 'dependencies' ? 'npm ci' : 'npm run check';
            let log = '';
            try { log = fs.readFileSync(path.join(env.RUNNER_TEMP, `kabinet-${step}.log`), 'utf8'); } catch {}
            const lines = log.replace(/\x1b\[[0-9;]*m/g, '').split(/\r?\n/).map((s) => s.trim());
            const reason = lines.find((s) => /^not ok\b/.test(s))
              || lines.find((s) => /^npm (?:ERR!|error) code [A-Z0-9_]+$/.test(s))
              || lines.find((s) => /^✗ /.test(s))
              || 'Ошибка; подробности в журнале job';
            const description = Array.from(`${task}: ${reason}`.replace(/[\x00-\x1f\x7f]/g, ' ')).slice(0, 140).join('');
            const response = await fetch(`https://api.github.com/repos/${repo}/statuses/${sha}`, {
              method: 'POST', redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: { Authorization: `Bearer ${env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ state: 'failure', context: 'audit/check-failure', description,
                target_url: `https://github.com/${repo}/actions/runs/${env.GITHUB_RUN_ID}` }),
            });
            if (!response.ok) throw new Error(`Не удалось записать диагностический статус: HTTP ${response.status}`);
            console.log(description);
          })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE

  build:
    # установщики собираются только при выпуске версии (метка v0.0.0) или вручную
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac-arm64
            cmd: npx electron-builder --mac dmg --arm64 --publish never -c.mac.identity=- -c.mac.sign=./scripts/sign-mac-test.js -c.artifactName='Kabinet-${version}-mac-arm64.${ext}'
          - os: macos-latest
            name: mac-intel
            cmd: npx electron-builder --mac dmg --x64 --publish never -c.mac.identity=- -c.mac.sign=./scripts/sign-mac-test.js -c.artifactName='Kabinet-${version}-mac-intel.${ext}'
          - os: ubuntu-latest
            name: linux
            cmd: npx electron-builder --linux AppImage --x64 --publish never
          - os: windows-latest
            name: windows
            cmd: npx electron-builder --win nsis --x64 --publish never -c.win.signAndEditExecutable=false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # macOS: ad-hoc подпись (без аккаунта разработчика). Без неё скачанная из интернета программа считается «повреждённой».
      - run: ${{ matrix.cmd }}
        shell: bash
        env:
          KABINET_ADHOC: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: kabinet-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  android:
    # APK собирается вместе с установщиками: при выпуске версии или вручную
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # выпуск = метка версии или ручной запуск с указанной меткой
      PUBLISH: ${{ (github.ref_type == 'tag' || inputs.tag != '') && 'true' || 'false' }}
      # отпечаток SHA-256 рабочего ключа подписи (не секрет); при смене ключа обновите
      EXPECTED_CERT_SHA256: 8703ed4e9f4cd67775750fa7ef56efee515b441aa279ce478d0ca73dd851bf96
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Зависимости (Electron для Android не нужен)
        run: |
          npm ci --ignore-scripts
          cd mobile && npm install

      - name: Проверка мобильной части
        run: node mobile/test/run-smoke.js

      - name: Сборка интерфейса для Android
        run: node mobile/build.js

      # Ключ хранится в Secrets репозитория: KABINET_KEYSTORE_BASE64, KABINET_KEYSTORE_PASSWORD,
      # KABINET_KEY_ALIAS (по умолчанию kabinet), KABINET_KEY_PASSWORD (по умолчанию как пароль хранилища).
      - name: Ключ подписи
        env:
          KS_B64: ${{ secrets.KABINET_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kabinet-release.keystore"
            echo "KABINET_KEYSTORE=$RUNNER_TEMP/kabinet-release.keystore" >> "$GITHUB_ENV"
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::Секрет KABINET_KEYSTORE_BASE64 не задан: выпуск с отладочной подписью запрещён."
            exit 1
          else
            echo "::warning::Секрет KABINET_KEYSTORE_BASE64 не задан: APK будет подписан отладочным ключом."
          fi

      - name: Проект Android (значки, подпись, плагины)
        env:
          KABINET_KEYSTORE_PASSWORD: ${{ secrets.KABINET_KEYSTORE_PASSWORD }}
          KABINET_KEY_ALIAS: ${{ secrets.KABINET_KEY_ALIAS }}
          KABINET_KEY_PASSWORD: ${{ secrets.KABINET_KEY_PASSWORD }}
        run: node mobile/android-setup.js

      - name: APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Проверить подпись
        run: |
          set -euo pipefail
          APK=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -n1)
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SIGNER=$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -n1)
          "$SIGNER" verify --print-certs "$APK" > signer.txt
          grep -v '^WARNING: META-INF' signer.txt || true
          ACTUAL=$(grep -m1 'certificate SHA-256 digest:' signer.txt | sed 's/.*digest: *//' | tr -d '[:space:]' | tr 'A-F' 'a-f' || true)
          if [ -z "$ACTUAL" ]; then
            echo "::error::Не удалось прочитать отпечаток подписи APK."
            exit 1
          fi
          echo "Отпечаток подписи APK: $ACTUAL"
          if [ "$PUBLISH" = "true" ] && [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK подписан не рабочим ключом (ожидался $EXPECTED_CERT_SHA256). В выпуск он не попадёт."
            exit 1
          fi

      - name: Переименовать
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/*.apk "out/Kabinet-${VERSION}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kabinet-android
          path: out/*.apk
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || inputs.tag != ''
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: files/*
