name: Проверка и сборка

on:
  push:
    branches: [main, master]
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Метка выпуска, к которому добавить установщики (например, v0.31.2). Пусто: только собрать'
        required: false

permissions:
  contents: write   # нужен, чтобы выпуск (Release) получил файлы

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    # установщики собираются только при выпуске версии (метка v0.0.0) или вручную
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac-arm64
            cmd: npx electron-builder --mac dmg --arm64 --publish never -c.artifactName='Kabinet-${version}-mac-arm64.${ext}'
          - os: macos-latest
            name: mac-intel
            cmd: npx electron-builder --mac dmg --x64 --publish never -c.artifactName='Kabinet-${version}-mac-intel.${ext}'
          - os: ubuntu-latest
            name: linux
            cmd: npx electron-builder --linux AppImage --x64 --publish never
          - os: windows-latest
            name: windows
            cmd: npx electron-builder --win nsis --x64 --publish never -c.win.signAndEditExecutable=false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: ${{ matrix.cmd }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: kabinet-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: files/*
