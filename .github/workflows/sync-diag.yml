name: Sync diagnostic APK

'on':
  push:
    branches: [diag/sync-metrics]

permissions:
  contents: read

concurrency:
  group: sync-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          cd mobile && npm install
      - run: node mobile/test/run-smoke.js
      - run: node mobile/build.js
      - name: Require existing signing key
        env:
          KS_B64: ${{ secrets.KABINET_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KS_B64" ]; then
            echo "::error::Missing production signing key; refusing a differently signed test APK."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/kabinet-release.keystore"
          echo "KABINET_KEYSTORE=$RUNNER_TEMP/kabinet-release.keystore" >> "$GITHUB_ENV"
      - name: Prepare Android project
        env:
          KABINET_KEYSTORE_PASSWORD: ${{ secrets.KABINET_KEYSTORE_PASSWORD }}
          KABINET_KEY_ALIAS: ${{ secrets.KABINET_KEY_ALIAS }}
          KABINET_KEY_PASSWORD: ${{ secrets.KABINET_KEY_PASSWORD }}
        run: node mobile/android-setup.js
      - name: Assemble APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify certificate and name test APK
        run: |
          set -euo pipefail
          APK=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -n1)
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SIGNER=$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -n1)
          "$SIGNER" verify --print-certs "$APK" > signer.txt
          ACTUAL=$(grep -m1 'certificate SHA-256 digest:' signer.txt | sed 's/.*digest: *//' | tr -d '[:space:]' | tr 'A-F' 'a-f' || true)
          EXPECTED=8703ed4e9f4cd67775750fa7ef56efee515b441aa279ce478d0ca73dd851bf96
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Wrong APK signing certificate."
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp "$APK" "out/Kabinet-${VERSION}-sync-diag-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: kabinet-sync-diag-android-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 7
