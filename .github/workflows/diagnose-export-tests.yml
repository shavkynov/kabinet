name: Diagnose export integration tests
on:
  push:
    branches: [claude/bugreport-fixes]
    paths: ['.github/workflows/diagnose-export-tests.yml']
permissions:
  contents: write
concurrency:
  group: diagnose-export-tests
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/bugreport-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Run tests and build structured report
        shell: python
        run: |
          import json, shlex, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          lines = ['# Export integration test diagnostics', '', 'Source commit: ' + sha, '']
          patch = subprocess.run(['node', 'scripts/apply-export-target.cjs'], capture_output=True, text=True)
          code = patch.returncode
          if code:
              lines.extend(['## Guarded patch failed', '', '```text', (patch.stderr or patch.stdout)[-8000:], '```'])
          else:
              command = shlex.split(json.loads(Path('package.json').read_text())['scripts']['test'])
              if command[:2] != ['node', '--test']:
                  raise RuntimeError('Unexpected test command; refusing to guess')
              junit = '/tmp/kabinet-export-junit.xml'
              result = subprocess.run(['node', '--test', '--test-reporter=junit', '--test-reporter-destination=' + junit] + command[2:], capture_output=True, text=True)
              code = result.returncode
              lines.extend(['Test process exit code: ' + str(code), ''])
              if Path(junit).exists():
                  try:
                      root = ET.parse(junit).getroot()
                      cases = list(root.iter('testcase'))
                      failed = []
                      for case in cases:
                          errors = list(case.findall('failure')) + list(case.findall('error'))
                          if errors:
                              failed.append((case, errors))
                      lines.extend(['Reported test cases: ' + str(len(cases)), 'Failed test cases: ' + str(len(failed)), ''])
                      for case, errors in failed:
                          lines.extend(['## ' + case.get('name', 'Unnamed test'), '', 'Suite: ' + case.get('classname', ''), ''])
                          for error in errors:
                              detail = error.get('message', '') + '\n' + ''.join(error.itertext())
                              lines.extend(['```text', detail[:12000], '```', ''])
                      if not failed and code:
                          lines.append('No failing testcase was reported; the test process failed outside the reported cases.')
                  except ET.ParseError as error:
                      lines.append('JUnit parsing failed: ' + str(error))
              else:
                  lines.append('JUnit report was not produced. No raw process output or environment variables are published.')
          report = Path('docs/ci/export-test-diagnostics.md')
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('/tmp/kabinet-diagnostic-exit-code').write_text(str(code))
      - name: Publish diagnostic report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/ci/export-test-diagnostics.md
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record export integration test failures'
            git push origin HEAD:claude/bugreport-fixes
          fi
      - name: Preserve failing test status
        shell: bash
        run: |
          code=$(cat /tmp/kabinet-diagnostic-exit-code)
          if [ "$code" != "0" ]; then exit 1; fi
